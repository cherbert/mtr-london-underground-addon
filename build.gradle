plugins {
	id "java"
}

group "net.londonunderground"
version rootProject.properties.version

subprojects {
	apply plugin: "java"

	dependencies {
		compileOnly "com.google.code.findbugs:jsr305:+"
	}

	repositories {
		flatDir { dirs "../libs" }
		maven { url "https://jitpack.io" }
		// JCM resolves from Modrinth, keeping a third-party jar out of libs/.
		// Scoped to its own group: unrestricted, Loom also queries it for yarn and
		// Minecraft, and Modrinth answers unknown artifacts with redirects rather
		// than a clean 404, which breaks mapping setup.
		maven {
			url "https://api.modrinth.com/maven"
			content { includeGroup "maven.modrinth" }
		}
	}

	tasks.withType(Javadoc).tap {
		configureEach { javadoc.options.addStringOption("Xdoclint:none", "-quiet") }
	}
}
